name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: windows-latest

    env:
      Project: RemnantSaveGuardian/RemnantSaveGuardian.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore RemnantSaveGuardian.sln

    - name: Build
      run: dotnet build RemnantSaveGuardian.sln --no-restore -c Release

    - name: Test
      run: dotnet test RemnantSaveGuardian.Tests/RemnantSaveGuardian.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/*.trx"

    - uses: kzrnm/get-net-sdk-project-versions-action@v2
      id: get-version
      with:
        proj-path: ${{ env.Project }}

    - name: Publish
      run: dotnet publish RemnantSaveGuardian/RemnantSaveGuardian.csproj --no-build -c Release -o "./publish"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 'RemnantSaveGuardian_${{steps.get-version.outputs.assembly-version}}'
        path: ./publish
