name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      Project: RemnantSaveGuardian/RemnantSaveGuardian.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore RemnantSaveGuardian.sln

    - name: Build
      run: dotnet build RemnantSaveGuardian.sln --no-restore -c Release

    - name: Test
      run: dotnet test RemnantSaveGuardian.Tests/RemnantSaveGuardian.Tests.csproj --no-build -c Release

    - name: Publish
      run: dotnet publish ${{ env.Project }} --no-build -c Release -o ./publish

    - name: Zip release
      run: Compress-Archive -Path ./publish/* -DestinationPath ./RemnantSaveGuardian_${{ github.ref_name }}.zip

    - name: Create GitHub Release
      run: >
        gh release create ${{ github.ref_name }}
        ./RemnantSaveGuardian_${{ github.ref_name }}.zip
        --title "RemnantSaveGuardian ${{ github.ref_name }}"
        --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
